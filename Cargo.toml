[package]
name = "lightrag-cli"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Agent-friendly Rust CLI for the complete LightRAG REST API"
repository = "https://github.com/magnus919/lightrag-cli"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
